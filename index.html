  const db = firebase.firestore();
  const auth = firebase.auth();
  const COLLECTION = "kv";
  let authReadyPromise = null;

  async function ensureFirebaseAuth() {
    if (auth.currentUser) return auth.currentUser;
    if (!authReadyPromise) {
      authReadyPromise = auth.signInAnonymously().then((cred) => {
        window.__farmFirebaseUser = cred.user || auth.currentUser || null;
        return window.__farmFirebaseUser;
      }).catch((err) => {
        authReadyPromise = null;
        console.error("Firebase anonymous auth error", err);
        throw new Error(
          err && err.code === "auth/operation-not-allowed"
            ? "Firebase 尚未啟用 Anonymous Authentication"
            : (err?.message || "Firebase 驗證失敗")
        );
      });
    }
    return authReadyPromise;
  }

  window.firebaseReady = ensureFirebaseAuth();
  window.__firebaseDb = db;
  window.__firebaseAuth = auth;

  window.storage = {
    async get(key, shared) {
      await ensureFirebaseAuth();
      const doc = await db.collection(COLLECTION).doc(key).get();
      if (!doc.exists) return null;
      const data = doc.data() || {};
      return { key, value: data.value, shared: !!shared };
    },
    async set(key, value, shared) {
      await ensureFirebaseAuth();
      await db.collection(COLLECTION).doc(key).set({
        key, value, updatedAt: Date.now(),
        updatedByUid: auth.currentUser ? auth.currentUser.uid : null,
      }, { merge: true });
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      await ensureFirebaseAuth();
      await db.collection(COLLECTION).doc(key).delete();
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      await ensureFirebaseAuth();
      const p = prefix || "";
      const end = p + "\uf8ff";
      const snap = await db.collection(COLLECTION)
        .where("key", ">=", p)
        .where("key", "<", end)
        .get();
      return { keys: snap.docs.map((d) => d.id), prefix: prefix || undefined, shared: !!shared };
    },
  };
})();

// 有限併發輔助函式：避免一次炸出太多同時請求觸發 storage API 本身的瞬間流量限制
// （這跟聊天訊息額度是兩回事；過去把測試資料寫入從「循序」改成「27筆一次全部平行」，
//  就是造成「Message rate limit exceeded」的實際原因之一）
async function runWithLimit(items, limit, worker) {
  const results = new Array(items.length);
  let cursor = 0;
  async function runner() {
    while (cursor < items.length) {
      const i = cursor++;
      try { results[i] = await worker(items[i], i); }
      catch (e) { results[i] = undefined; console.error(e); }
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, runner));
  return results;
}

function DaySprayPicker({ day, year, month, drugList, fertilizerList, editable, initialEntries, onClose, onSave }) {
  const initialQty = {};

  const allItems = [...drugList, ...fertilizerList];

  const toggle = (code) => {
    setSelected((cur) => {
      if (cur.includes(code)) return cur.filter((c) => c !== code);
      setQty((q) => ({ ...q, [code]: q[code] || 1 }));
      return [...cur, code];

  const setItemQty = (code, val) => {

function DayWorkPicker({ day, year, month, workItems, editable, initialEntry, onClose, onSave }) {
  const [selected, setSelected] = useState(initialEntry.items);

  const buildAutoPrefix = (codes) => (codes.length ? `代號：${codes.join("、")}　` : "");
  const autoPrefixRef = useRef(
    initialEntry.note && initialEntry.note.startsWith(buildAutoPrefix(initialEntry.items))
      ? buildAutoPrefix(initialEntry.items)
      : ""
  );

  const toggle = (code) => {
    setSelected((cur) => {
      const next = cur.includes(code) ? cur.filter((c) => c !== code) : [...cur, code];
      const newPrefix = buildAutoPrefix(next);
      setNote((prevNote) => {
        const oldPrefix = autoPrefixRef.current;
        const rest = prevNote.startsWith(oldPrefix) ? prevNote.slice(oldPrefix.length) : prevNote;
        return newPrefix + rest;
      });
      autoPrefixRef.current = newPrefix;
      return next;
    });
  };
  const handleSave = () => onSave({ items: selected, note });

    setUpdating(true);
    const nextTotals = {};
    REPORT_ROWS.forEach((r) => { nextTotals[r.key] = 0; });
    const byDay = {};
    const pushDay = (day, entry) => {
      if (day < 1 || day > daysCount) return;
      if (!byDay[day]) byDay[day] = [];
      const dup = byDay[day].some((e) => e.rowKey === entry.rowKey && e.qty === entry.qty && e.at === entry.at && e.personName === entry.personName);
      if (dup) return;

    const dayFromStamp = (stamp) => {

      let y, m, d;

        const p = s.split(" ")[0].split("/");
        if (p.length < 3) return null;
        y = Number(p[0]); m = Number(p[1]); d = Number(p[2]);
      } else if (s.includes("-")) {
        const p = s.split(" ")[0].split("T")[0].split("-");

          if (!h || !h.rowKey) return;
          const qty = parseFloat(h.qty);

          const d = dayFromStamp(h.at);
          // 有回報時間才入格；無時間的歷史不入（正常流程回報都會帶 at）
          if (d == null) return;
